name: Release

# What users install is not what this repository contains. The repository is a
# development workspace -- test framework, contributor tooling, documentation
# build -- and the Godot Asset Library installs whatever it finds at the commit
# it is pointed at. So a release is a separate, smaller tree.
#
# tools/build_release_tree.py decides what is in it. This workflow only moves
# the result into the two places it needs to be:
#
#   the `release` branch   what the Asset Library downloads, by commit hash
#   the GitHub Release     a zip, for anyone installing by hand
#
# The `release` branch must already exist; it is created once, by hand, and
# never merged into or from.
#
# A branch dispatch builds and checks the packages with a read-only token.
# Only a tag can publish, whether started by a push or a manual dispatch.
#
# It never makes the GitHub Release. The person cutting the release does, so the
# release page names them and not github-actions (DEVELOPMENT.md, Cutting a
# release).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and verify release packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Read and validate the package version
        id: version
        # plugin.cfg names the zips and the release branch commit, and the smoke
        # gate below reads it too. A tag pushed before the bump would pass every
        # check and ship the new code under the old version's name (#919).
        run: |
          version="$(python -c "import sys; sys.path.insert(0,'tools'); import build_release_tree as b; print(b.plugin_version())")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::plugin.cfg must contain a release or development version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == 'tag' && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match plugin.cfg version $version"
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Editor smoke gate
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # The smoke checklist is 599 steps and nobody runs it end to end (#593).
        # So the top of it is a short gate that someone does run, and this step
        # is what makes "does run" true instead of aspirational. It fails the
        # release rather than warning, because a warning nobody reads is the
        # thing being fixed.
        run: |
          DOC=docs/HammerForge_Editor_Smoke_Checklist.md
          RECORDED="$(sed -n 's/^Gate passed:[[:space:]]*//p' "$DOC" | sed 's/[[:space:]]*$//' | head -n 1)"
          if [ "$RECORDED" != "$VERSION" ]; then
            echo "::error::the editor smoke gate has not been recorded for $VERSION"
            echo "$DOC records: ${RECORDED:-nothing}"
            echo "Run the 'Release gate' section of that document against this"
            echo "build, then set its 'Gate passed:' line to $VERSION and push"
            echo "that commit before tagging."
            exit 1
          fi
          echo "editor smoke gate recorded for $VERSION"

      - name: Build the release tree
        run: python tools/build_release_tree.py "$RUNNER_TEMP/release"

      - name: Refuse to ship development tooling
        # The script excludes these, but this is the check that matters: it runs
        # against the built output rather than against the list that was meant
        # to produce it.
        run: |
          cd "$RUNNER_TEMP/release"
          for unwanted in addons/gut addons/hf_docshot tests tools docs samples project.godot; do
            if [ -e "$unwanted" ]; then
              echo "::error::$unwanted reached the release tree" && exit 1
            fi
          done
          # Naming folders one at a time only catches the ones we thought of.
          # addons/hammerforge is the whole of what ships.
          for addon in addons/*; do
            [ -e "$addon" ] || continue
            if [ "$addon" != "addons/hammerforge" ]; then
              echo "::error::$addon reached the release tree" && exit 1
            fi
          done
          test -f addons/hammerforge/plugin.cfg || { echo "::error::no plugin"; exit 1; }
          test -f addons/hammerforge/LICENSE   || { echo "::error::no licence"; exit 1; }
          # The addon zip and the Asset Library install are both addons/ and
          # nothing else, so this file is the only thing in either of them that
          # says what a mapper has just installed (#780).
          test -f addons/hammerforge/README.md || { echo "::error::no readme"; exit 1; }
          echo "release tree: $(find . -type f | wc -l) files"

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd "$RUNNER_TEMP/release"
          tar -cf "$RUNNER_TEMP/release-tree.tar" .
          zip -qr "$RUNNER_TEMP/hammerforge-$VERSION.zip" .

          # The one most people want: the plugin and nothing else, carrying the
          # addons/hammerforge/ path so it extracts straight into a project. The
          # full zip above keeps LICENSE, README.md and .gitignore beside it for
          # anyone who wants them.
          zip -qr "$RUNNER_TEMP/hammerforge-$VERSION-addon.zip" addons

          # Checked here rather than assumed, because this is the archive a
          # mapper extracts over their own project.
          unzip -Z1 "$RUNNER_TEMP/hammerforge-$VERSION-addon.zip" > "$RUNNER_TEMP/addon_paths.txt"
          cut -d/ -f1 "$RUNNER_TEMP/addon_paths.txt" | sort -u > "$RUNNER_TEMP/addon_roots.txt"
          echo addons > "$RUNNER_TEMP/addon_expected.txt"
          if ! diff -u "$RUNNER_TEMP/addon_expected.txt" "$RUNNER_TEMP/addon_roots.txt"; then
            echo "::error::the addon zip is not addons/ alone"
            exit 1
          fi
          grep -Fxq "addons/hammerforge/plugin.cfg" "$RUNNER_TEMP/addon_paths.txt" || {
              echo "::error::the addon zip has no plugin.cfg in it"; exit 1; }
          echo "addon zip: $(wc -l < "$RUNNER_TEMP/addon_paths.txt") entries under addons/"

      - name: Check what the Asset Library will download
        # The Asset Library serves this branch as a *git archive*, so
        # `export-ignore` -- not the ship list -- decides what a mapper ends up
        # with. Godot's installer strips the `<repo>-<sha>/` wrapper and then
        # offers everything left at the root, checked, into their project root.
        #
        # Checked against the archive itself rather than against the
        # .gitattributes that is supposed to produce it, for the same reason
        # "Refuse to ship development tooling" checks the built tree.
        run: |
          cd "$RUNNER_TEMP/release"
          git init -q
          git add -A
          git archive "$(git write-tree)" | tar -t > "$RUNNER_TEMP/archive.txt"
          cut -d/ -f1 "$RUNNER_TEMP/archive.txt" | sort -u > "$RUNNER_TEMP/roots.txt"
          {
            echo LICENSE
            echo addons
          } > "$RUNNER_TEMP/expected.txt"
          if ! diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/roots.txt"; then
            echo "::error::the Asset Library download would not be addons/ and LICENSE alone"
            echo "Anything at the archive root lands beside the mapper's own files."
            echo "See RELEASE_GITATTRIBUTES in tools/build_release_tree.py."
            exit 1
          fi
          # The step above only compares the archive's *roots*, so it cannot see
          # a file lost from inside addons/. The addon README is the one that
          # would go quietly: `/README.md export-ignore` is anchored to the root
          # by that leading slash, and dropping the slash would strip this one
          # too, leaving an Asset Library install with no explanation in it.
          grep -qx "addons/hammerforge/README.md" "$RUNNER_TEMP/archive.txt" || {
            echo "::error::the addon README is not in the Asset Library download"
            echo "Check the export-ignore rules in RELEASE_GITATTRIBUTES."
            exit 1
          }
          echo "installing this gives a project addons/ and LICENSE, and nothing else"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: release-packages
          path: |
            ${{ runner.temp }}/release-tree.tar
            ${{ runner.temp }}/hammerforge-*.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    name: Publish release packages and Asset Library tree
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - name: Require a release commit from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)"
          if [[ "$status" != 'ahead' && "$status" != 'identical' ]]; then
            echo "::error::The tagged release commit must be on main"
            exit 1
          fi

      - name: Check a person made the GitHub Release
        # This workflow used to make the release when the tag had none (#775),
        # and a release made with the workflow's token names github-actions as
        # its author: 0.4.0 shipped that way and was made again by hand. Release
        # Drafter's drafts are github-actions' too. Check before publishing.
        #
        # `gh release view <tag>` looks up the published release and a draft on
        # the tag at once and takes whichever answers first, and Release
        # Drafter keeps a draft on the next tag. The releases/tags endpoint
        # answers with the published release only. Its id goes to the upload
        # below, so the zips land on this release and not on the draft (#1737).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A 404 prints its body on stdout, so the exit status decides.
          if ! FOUND="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '[.author.login, .id] | @tsv' 2>/dev/null)"; then
            FOUND=""
          fi
          AUTHOR="$(printf '%s' "$FOUND" | cut -f1)"
          RELEASE_ID="$(printf '%s' "$FOUND" | cut -f2)"
          case "$AUTHOR" in
            "")
              echo "::error::there is no published GitHub Release for $GITHUB_REF_NAME"
              ;;
            *"[bot]" | github-actions)
              echo "::error::the $GITHUB_REF_NAME release was made by $AUTHOR, not a person"
              ;;
            *)
              echo "$GITHUB_REF_NAME release $RELEASE_ID made by $AUTHOR"
              echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
              exit 0
              ;;
          esac
          echo "Make it yourself, then start this run on the tag:"
          echo "  gh release create $GITHUB_REF_NAME --verify-tag --prerelease --latest=false --title $GITHUB_REF_NAME --notes-file notes.md"
          echo "  gh workflow run release.yml --ref $GITHUB_REF_NAME"
          echo "A bot's release has to be deleted first (gh release delete $GITHUB_REF_NAME)."
          exit 1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: ${{ runner.temp }}/release-packages

      - name: Prepare the release branch commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          work="$RUNNER_TEMP/relbranch"
          git clone --depth 1 --branch release "https://github.com/$GITHUB_REPOSITORY.git" "$work"
          cd "$work"
          # A rerun of an older tag must not replace a newer installation tree.
          previous="$(git show -s --format=%B HEAD | sed -nE 's/^Built from ([0-9a-f]{40}) by .*/\1/p')"
          if [[ -n "$previous" && "$previous" != "$GITHUB_SHA" ]]; then
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA" --jq .status)"
            if [[ "$status" != 'ahead' ]]; then
              echo "::error::The tagged release must descend from the release branch's current source"
              exit 1
            fi
          fi
          # Replace the tree so removed files cannot linger in the installation.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          tar -xf "$RUNNER_TEMP/release-packages/release-tree.tar"
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "HammerForge $VERSION" \
                       -m "Built from ${GITHUB_SHA} by .github/workflows/release.yml."
            echo "RELEASE_CHANGED=true" >> "$GITHUB_ENV"
          fi
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Attach the zip to the GitHub Release
        # Into the release the person made; "Check a person made the GitHub
        # Release" above has already refused a run without one. Before the
        # release branch is pushed, so the Asset Library never serves a tree
        # with no zip on the release page (#775). By the release's id, which
        # that step found, since `gh release upload <tag>` can pick Release
        # Drafter's draft on the same tag (#1737). An asset of the same name is
        # replaced, as --clobber did.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/release-packages"
          for ZIP in "hammerforge-$VERSION-addon.zip" "hammerforge-$VERSION.zip"; do
            test -f "$ZIP"
          done
          for ZIP in "hammerforge-$VERSION-addon.zip" "hammerforge-$VERSION.zip"; do
            NAME="$(basename "$ZIP")"
            OLD="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq ".[] | select(.name == \"$NAME\") | .id")"
            if [ -n "$OLD" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$OLD"
            fi
            gh api --method POST \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$NAME" \
              -H "Content-Type: application/zip" --input "$ZIP" --jq .browser_download_url
          done

      - name: Push the release branch
        # Last, after the zip is attached, so nothing the Asset Library serves
        # can exist without the zip beside it.
        if: env.RELEASE_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/relbranch"
          git push origin release

      - name: Asset Library commit
        # Printed rather than submitted. There is an API for updating an entry,
        # despite what this comment used to say: POST /asset/{id}. Its token
        # comes from POST /login, which takes a username and password and
        # nothing else, and the edit lands in a moderation queue either way. So
        # the hash is still pasted into the form by hand, deliberately.
        #
        # This summary is read once, in the minutes after a release, and never
        # again, so it is not what catches a paste that did not happen. The
        # weekly Asset Library freshness workflow is. See
        # tools/check_assetlib_freshness.py.
        run: |
          {
            echo "### Asset Library"
            echo "Update the Download Commit to \`$RELEASE_COMMIT\`"
            echo "at https://godotengine.org/asset-library/asset/edit"
          } >> "$GITHUB_STEP_SUMMARY"
