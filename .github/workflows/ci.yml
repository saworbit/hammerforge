name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read is what this workflow needs. The one job that writes declares it itself,
# next to the reason.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: GDScript Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install gdtoolkit
        run: |
          python -m pip install --upgrade setuptools
          python -m pip install -r requirements-ci.txt

      - name: Check formatting
        run: gdformat --check addons/hammerforge/ tests/

      - name: Lint
        run: gdlint addons/hammerforge/

      # A world transform assigned to a node that is not in the tree yet writes
      # the local one instead, and the node lands shifted by its container. That
      # has been fixed six times, most recently in the baker, where it was
      # applying the root transform twice to geometry that ships. The selftest
      # runs first so a detector that has quietly stopped detecting fails loudly
      # rather than passing everything.
      - name: Check the placement-order guard still detects
        run: python3 tools/check_placement_order.py --selftest

      - name: Check placement order
        run: python3 tools/check_placement_order.py

  tooling-checks:
    name: Workflow & Tooling Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install tooling
        run: python -m pip install -r requirements-ci.txt

      # tools/ is small but two of its scripts decide whether a build passes,
      # and until now nothing checked them at all.
      - name: Lint tools/
        run: ruff check tools/

      - name: Check tools/ formatting
        run: ruff format --check tools/

      # Workflow syntax, expression errors, and shellcheck over every run block.
      - name: Lint workflow syntax
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

      # Token scope, credential persistence, expression injection into run
      # blocks, and actions with known advisories. Needs the token only to look
      # advisories up.
      - name: Audit workflows for supply-chain risk
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .github/workflows/

  unit-tests:
    name: GUT Unit Tests
    runs-on: ubuntu-latest
    # Only the push-to-main run writes the totals back; a pull request run has
    # nothing to push to and leaves the documents alone.
    permissions:
      contents: write
    env:
      GODOT_VERSION: "4.7-stable"
    steps:
      # persist-credentials stays on here, unlike the other jobs: the counts
      # step below pushes with this token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # zizmor: ignore[artipacked]

      - name: Download Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Import project
        run: godot --headless --import --path . 2>&1

      - name: Run GUT tests
        run: |
          set -o pipefail
          godot --headless -s res://addons/gut/gut_cmdln.gd --path . 2>&1 | tee gut.log

      # The five documents that quote the size of the suite go stale on any pull
      # request that adds a test. CI has just measured them, so CI writes them
      # down rather than asking every contributor to.
      - name: Update published test counts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 tools/update_test_counts.py --gut-log gut.log --write

      - name: Commit updated counts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Scoped to exactly the documents update_test_counts.py rewrites. This
          # was `git add -A`, which in c121f50 swept the 73 MB Godot download
          # still sitting in the workspace into a commit on main.
          DOCS=(README.md docs/features.md DEVELOPMENT.md HammerForge_SPEC.md ROADMAP.md)
          if git diff --quiet -- "${DOCS[@]}"; then
            echo "Counts already current, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${DOCS[@]}"
          # [skip ci] plus the fact that a GITHUB_TOKEN push raises no workflow
          # event: this cannot start a run that writes the counts again.
          git commit -m "Update published test counts [skip ci]"
          # Another merge may have landed while the suite was running, which
          # would make this push non-fast-forward. Rebase onto whatever main is
          # now and try once more rather than failing a green build over it.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected, rebasing onto main (attempt $attempt)."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          echo "Could not push the updated counts after three attempts."
          exit 1
