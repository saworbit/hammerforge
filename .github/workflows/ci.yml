name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read is what this workflow needs. The one job that writes declares it itself,
# next to the reason.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: GDScript Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install gdtoolkit
        run: |
          python -m pip install --upgrade setuptools
          python -m pip install -r requirements-ci.txt

      - name: Check formatting
        run: gdformat --check addons/hammerforge/ tests/ tools/ hammerforge_tools/

      # tools/ is in scope because the vibe harness is committed on purpose and
      # run every sweep. It sat outside both checks and drifted: one scenario
      # carried a raw newline inside a double quoted string, which Godot's parser
      # takes and every other GDScript tool chokes on. That is #115 again, in the
      # directory #115 never looked at.
      - name: Lint
        run: gdlint addons/hammerforge/ tools/ hammerforge_tools/

      # A world transform assigned to a node that is not in the tree yet writes
      # the local one instead, and the node lands shifted by its container. That
      # has been fixed six times, most recently in the baker, where it was
      # applying the root transform twice to geometry that ships. The selftest
      # runs first so a detector that has quietly stopped detecting fails loudly
      # rather than passing everything.
      - name: Check the placement-order guard still detects
        run: python3 tools/check_placement_order.py --selftest

      - name: Check placement order
        run: python3 tools/check_placement_order.py

      # project.godot is tracked, and the editor rewrites it the moment anyone
      # enables a plugin. addons/godot_mcp and its autoload rode in that way and
      # shipped enabled for months. The template asks a human to check; this is
      # the part that cannot forget.
      - name: Check the project-settings guard still detects
        run: python3 tools/check_project_settings.py --selftest

      - name: Check project settings
        run: python3 tools/check_project_settings.py

      # wait_for_ci.py decides whether a branch is safe to merge. Its whole job
      # is refusing a green run that belongs to some other commit, so the
      # fixtures for that case run here rather than being taken on trust.
      - name: Check the CI wait grades the right commit
        run: python3 tools/wait_for_ci.py --selftest

      # The freshness check itself runs weekly, in its own workflow, because it
      # asks two web APIs a question. Its reasoning is ordinary code and runs
      # here, so the states it has to tell apart -- a forgotten paste, a paste
      # still in the moderation queue, a rejected one -- are checked on every
      # pull request rather than once a week against whatever the library says.
      - name: Check the Asset Library guard still detects
        run: python3 tools/check_assetlib_freshness.py --selftest

      # The vibe sweep grades itself on each scenario's exit code, and a scenario
      # that hits a GDScript error still exits 0. Reported as clean, that is
      # indistinguishable from a real pass, which is how a scenario calling a
      # function removed two releases ago went unnoticed (#739).
      - name: Check the vibe runner still grades a broken scenario
        run: python3 tools/vibe/run_vibe.py --selftest

      # The suite is run in four shards and the totals are published from what
      # they report together. A splitter that quietly drops a file gives a green
      # run with less in it, so the split is checked before it is trusted.
      - name: Check the test split still covers the suite
        run: python3 tools/shard_tests.py --selftest

      # The five published totals are now added up from four shard logs rather
      # than read from one. That addition is where a wrong number would come
      # from, so it is checked here.
      - name: Check the shard totals still add up
        run: python3 tools/update_test_counts.py --selftest

      # #609 and #610 were 66 dead declarations, thirteen of them regrown by
      # architecture tests that required them by name. The scan that found them
      # counted any mention as a caller, including doc comments and the
      # CHANGELOG, so a dead function stayed off the list by being written
      # about. This one reads GDScript, strips comments and literals in one
      # left-to-right pass, and harvests the literals separately because string
      # dispatch is load bearing here.
      - name: Check the dead-declaration guard still detects
        run: python3 tools/check_dead_declarations.py --selftest

      - name: Check for dead declarations
        run: python3 tools/check_dead_declarations.py

  tooling-checks:
    name: Workflow & Tooling Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install tooling
        run: python -m pip install -r requirements-ci.txt

      # tools/ is small but two of its scripts decide whether a build passes,
      # and until now nothing checked them at all.
      - name: Lint tools/
        run: ruff check tools/

      - name: Check tools/ formatting
        run: ruff format --check tools/

      # Workflow syntax, expression errors, and shellcheck over every run block.
      - name: Lint workflow syntax
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

      # Token scope, credential persistence, expression injection into run
      # blocks, and actions with known advisories. Needs the token only to look
      # advisories up.
      - name: Audit workflows for supply-chain risk
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .github/workflows/

      # A broken .github/dependabot.yml fails nothing: Dependabot just stops
      # running, quietly, and the first sign is a bump that never arrived.
      # Nothing else in this repository looks at that file. The schema is
      # vendored in the tool, so this needs no network.
      - name: Validate the Dependabot config
        run: check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml

  unit-test-shard:
    name: GUT Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Every shard's result is wanted, not just the first failure. Stopping at
      # shard 2 hides whatever shard 3 would have said, and then the rerun finds
      # it -- which is the slow way round.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      GODOT_VERSION: "4.7-stable"
      # The shard count is stated three times: matrix.shard above, this
      # SHARDS, and the aggregate job's own SHARDS below. That duplication is
      # safe only because the aggregate's "every shard reported" guard counts
      # the uploaded logs and fails if any of the three disagree -- don't
      # simplify that guard away, it is what lets these stay independent.
      SHARDS: "4"
      OWN_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      # Read-only, and no credentials left behind: nothing in a shard writes.
      # The counts commit and its deploy key live in the aggregate job below,
      # which runs none of the test code.
      #
      # ref must match the aggregate job's checkout below. The aggregate
      # cross-checks the shards' summed Scripts count against
      # `tools/shard_tests.py --count` run on the tree IT checked out; if the
      # shards measured a different tree than the aggregate, that check
      # compares two different commits and can fail -- or worse, pass -- for
      # the wrong reason.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.OWN_PR == 'true' && github.event.pull_request.head.ref || '' }}
          persist-credentials: false

      # One GET, no retry, and -q hid the reason it failed. On d1b6ca5 the
      # release host answered this shard with an error while the other three
      # fetched the same URL a second apart and got it, so main went red on a
      # run where no test had been executed. Four shards each fetch this, so
      # every run carries four chances to lose the merge gate to someone else's
      # bad second.
      #
      # wget does not retry an HTTP error response on its own: --tries treats
      # one as fatal, which is why that attempt gave up in half a second. The
      # listed codes are the transient ones. The loop around it covers what the
      # list cannot: a code that is not on it, and a zip that arrives short with
      # a 200 on it. -S is what puts the status line in the log, because -q was
      # swallowing it, and -nv alone prints the URL again per retry without
      # saying what came back.
      - name: Download Godot
        run: |
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          for attempt in 1 2 3; do
            if wget -nv -S --tries=3 --waitretry=5 --retry-connrefused \
                --retry-on-http-error=429,500,502,503,504 "$url" -O godot.zip \
                && unzip -qt godot.zip; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "Godot ${GODOT_VERSION} would not download after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Import project
        run: godot --headless --import --path . 2>&1

      - name: Run this shard of the suite
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          # -gconfig= is load-bearing, and deleting it does not fail anything.
          # gut_config.gd applies `dirs` and then `tests` one after the other,
          # so with .gutconfig.json still in play each shard would collect all
          # 222 scripts on top of its own slice: four green runs of the whole
          # suite, four times the work, and nothing anywhere saying so.
          godot --headless -s res://addons/gut/gut_cmdln.gd --path . \
            -gconfig= -gexit -glog=1 \
            -gtest="$(python3 tools/shard_tests.py --shard "$SHARD" --of "$SHARDS")" \
            2>&1 | tee "gut-shard-${SHARD}.log"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gut-shard-${{ matrix.shard }}
          path: gut-shard-${{ matrix.shard }}.log
          # Long enough to read after a failure, short enough not to accumulate.
          retention-days: 3

  # Named exactly "GUT Unit Tests" because that is what the main ruleset requires.
  # The shard legs above report under their own names and are not required
  # checks; this job speaks for all four.
  unit-tests:
    name: GUT Unit Tests
    runs-on: ubuntu-latest
    needs: unit-test-shard
    # Runs even when a shard failed, so this reports a red X. Without always()
    # it would be *skipped* instead, and a skipped required check never reports
    # at all -- the pull request would sit waiting on it for good.
    if: always()
    # Looks wrong next to a job that git pushes below, but the push travels
    # over HF_COUNTS_DEPLOY_KEY (an ssh-key on the checkout step), not the
    # workflow token -- so the token's permissions never come into it.
    permissions:
      contents: read
    env:
      SHARDS: "4"
      OWN_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Fail if any shard failed
        if: needs.unit-test-shard.result != 'success'
        env:
          RESULT: ${{ needs.unit-test-shard.result }}
        run: |
          echo "::error::a GUT shard did not pass ($RESULT)"
          exit 1

      # Same checkout as the old unit-tests job: the head branch and the deploy
      # key on this repository's own pull requests, so the counts commit can
      # land on that branch and start a run of its own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # zizmor: ignore[artipacked]
        with:
          ref: ${{ env.OWN_PR == 'true' && github.event.pull_request.head.ref || '' }}
          ssh-key: ${{ env.OWN_PR == 'true' && secrets.HF_COUNTS_DEPLOY_KEY || '' }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gut-shard-*
          merge-multiple: true
          path: shard-logs

      - name: Check every shard reported
        run: |
          # -maxdepth 1 so this counts exactly what the update step below
          # globs: a recursive find would count logs that glob cannot see, and
          # `ls` here trips shellcheck SC2012, which actionlint fails on.
          found=$(find shard-logs -maxdepth 1 -name 'gut-shard-*.log' | wc -l)
          if [ "$found" -ne "$SHARDS" ]; then
            echo "::error::expected $SHARDS shard logs, found $found"
            exit 1
          fi

      # The five documents that quote the size of the suite go stale on any pull
      # request that adds a test. CI has just measured the suite -- in four
      # pieces -- so CI writes the numbers down. --expect-scripts is what stops
      # a shard that ran short from publishing a smaller suite as fact.
      - name: Update published test counts
        if: env.OWN_PR == 'true'
        run: |
          python3 tools/update_test_counts.py --gut-log shard-logs/gut-shard-*.log \
            --expect-scripts "$(python3 tools/shard_tests.py --count)" --write

      - name: Commit the counts to this pull request
        if: env.OWN_PR == 'true'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Scoped to exactly the documents update_test_counts.py rewrites.
          DOCS=(README.md docs/features.md DEVELOPMENT.md HammerForge_SPEC.md ROADMAP.md)
          if git diff --quiet -- "${DOCS[@]}"; then
            echo "Counts already current, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${DOCS[@]}"
          git commit -m "Update published test counts"
          # Deliberately no [skip ci]: this push must start a run, so the new
          # head commit carries the checks the branch ruleset requires. It
          # cannot loop, because that run measures the same suite, finds the
          # numbers already written, and pushes nothing.
          git push origin "HEAD:${BRANCH}"

      # Two pull requests that each add tests can each write a number that was
      # correct when it was measured, and main ends up between them. The next
      # pull request that touches the suite writes the true figure, since the
      # script writes what it measured rather than a delta -- so this reports
      # rather than fails.
      - name: Report drift in main's published counts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! python3 tools/update_test_counts.py --gut-log shard-logs/gut-shard-*.log \
            --expect-scripts "$(python3 tools/shard_tests.py --count)" --check; then
            echo "::warning::Published test counts on main are stale. The next pull request that changes the suite will correct them."
          fi
