name: Docs

on:
  push:
    branches: [main]
    paths: &site-paths
      - "docs/**"
      - "mkdocs.yml"
      # The theme override is part of the site: it carries the link-preview
      # metadata, the structured data and the Search Console proof. Leaving it
      # out meant a change to it built locally, merged cleanly, and never
      # deployed -- with nothing anywhere reporting a failure.
      - "overrides/**"
      # The pinned theme. Without it a mkdocs-material bump was never built
      # against the site, and one that broke the strict build would surface as
      # the next unrelated docs change failing.
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  # The same build on a pull request, without the deploy. Only a push to main
  # ran it before, so the link #939 added outside docs_dir passed every check,
  # failed the strict build on merge, and kept Pages from deploying for four
  # days until #964. The anchor is so the two filters cannot drift apart.
  #
  # Not a required check, and it must not become one: it runs only when these
  # paths change, and a required check that never reports leaves the pull
  # request waiting on it for good.
  pull_request:
    branches: [main]
    paths: *site-paths
  workflow_dispatch:

# Scoped per job rather than granting the whole workflow write access to
# Pages: only the deploy job publishes anything.
permissions:
  contents: read

# A deploy queues behind the one in flight rather than cancelling it. A pull
# request builds in a group of its own, because GitHub keeps one waiting run per
# group and cancels it when another arrives: sharing `pages` would let any pull
# request knock a queued deploy out. A newer push to the same pull request
# replaces its older build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages only reads the Pages settings; it does not enable them.
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          # Must track site_dir in mkdocs.yml, which is .site so Godot does not
          # scan the built site and report UID collisions against docs/. Left
          # running on a pull request so a site_dir change that misses this
          # fails there too.
          path: .site

  deploy:
    needs: build
    # The build runs on a pull request to fail before merge. Publishing is for
    # main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
